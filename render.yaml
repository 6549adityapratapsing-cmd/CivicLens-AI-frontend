services:
  - type: web
    name: civiclens-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: 45.0
